# ============================================================================================
# FICTIONAL BUSINESS. Test and demo data only.
# "Steadfast Heating & Air" does not exist. Every name, phone number, price, and policy in this
# file is invented for this voice-receptionist test agent. Never present any of it
# as a real business, and never put real customer data in this file.
# Phone numbers use the 555-01XX range reserved for fictional use.
# Client-facing text here (greeting, handoff) carries no geographic or location references.
# ============================================================================================

business:
  name: Steadfast Heating & Air
  spoken_name: Steadfast Heating and Air
  kind: heating and cooling service company
  fictional: true
  greeting: >-
    Thanks for calling Steadfast Heating and Air. I'm the AI assistant. I can book a service
    visit, answer questions, or take a message. How can I help?

# 24-hour clock. A day that is not open is written as `closed`.
hours:
  monday:    {open: "08:00", close: "17:00"}
  tuesday:   {open: "08:00", close: "17:00"}
  wednesday: {open: "08:00", close: "17:00"}
  thursday:  {open: "08:00", close: "17:00"}
  friday:    {open: "08:00", close: "17:00"}
  saturday:  {open: "09:00", close: "13:00"}
  sunday:    closed

# `keywords` let the scripted placeholder LLM and the booking tool map a caller's words to a
# service. Matching is whole-word and case-insensitive; the longest match wins.
services:
  - name: AC tune-up
    duration_minutes: 60
    keywords: [ac tune-up, ac tune up, ac tuneup, air conditioner tune-up, ac maintenance, ac service, cooling tune-up]
  - name: Furnace tune-up
    duration_minutes: 60
    keywords: [furnace tune-up, furnace tune up, furnace tuneup, heating tune-up, furnace maintenance, furnace service]
  - name: Repair visit
    duration_minutes: 90
    keywords: [repair, not working, broken, no heat, no cooling, not cooling, not heating, blowing warm air, blowing warm, leaking, noise, banging, rattling]
  - name: Thermostat installation
    duration_minutes: 60
    keywords: [thermostat installation, thermostat install, install a thermostat, new thermostat, thermostat]
  - name: New system estimate
    duration_minutes: 60
    keywords: [new system estimate, estimate, quote, new system, replacement]

booking:
  slot_minutes: 60        # visits start on this grid, counted from opening time
  max_alternatives: 3     # open slots offered when the requested one is taken
  search_days: 14         # how far ahead to look for alternatives

# lookup_faq matches whole-word keyword phrases in the caller's question. No match returns
# nothing, and the agent must offer a callback instead of answering.
faq:
  - id: hours
    question: What are your hours?
    answer: >-
      We're open Monday through Friday from 8 AM to 5 PM, and Saturday from 9 AM to 1 PM.
      We're closed on Sunday.
    keywords: [hours, open, close, closed, closing, weekend, saturday, sunday]
  - id: diagnostic-fee
    question: What does a repair visit cost?
    answer: >-
      The diagnostic visit is 89 dollars, and we waive it if you go ahead with the repair.
    keywords: [diagnostic fee, diagnostic, service call fee, service call, trip charge, service fee, repair visit cost]
  - id: brands
    question: What equipment do you work on?
    answer: >-
      We service all major brands of furnaces, air conditioners, and heat pumps.
    keywords: [brand, brands, heat pump, heat pumps, equipment]
  - id: after-hours
    question: Do you offer emergency or after-hours service?
    answer: >-
      We don't run after-hours service. If you smell gas, leave the house and call your gas
      utility or 911. For anything else, I can book the first open visit or take a message.
    keywords: [emergency, after hours, after-hours, overnight, 24/7, middle of the night]
  - id: payment
    question: How can I pay?
    answer: >-
      We take major credit cards, checks, and cash. Payment is due when the work is done.
    keywords: [pay, payment, credit card, credit cards, cash, pay by check, take checks, accept checks]
  - id: comfort-plan
    question: Do you have a maintenance plan?
    answer: >-
      Our comfort plan covers two tune-ups a year, one in spring and one in fall, plus priority
      booking. The office can go over plan pricing when they call you back.
    keywords: [maintenance plan, service plan, comfort plan, membership, plan]
  - id: warranty
    question: Do you guarantee your work?
    answer: >-
      Repairs come with a one-year parts and labor warranty.
    keywords: [warranty, guarantee, guaranteed]
  - id: licensed
    question: Are you licensed and insured?
    answer: >-
      Yes. Our technicians are licensed and the company is fully insured.
    keywords: [licensed, insured, license]
  - id: free-estimates
    question: Do you charge for estimates?
    answer: >-
      Estimates for a new system are free. A technician comes out, measures, and leaves you a
      written quote.
    keywords: [free estimate, free estimates, charge for an estimate, charge for estimates]
  - id: arrival-window
    question: When will the technician show up?
    answer: >-
      We give a two-hour arrival window, and the technician calls when they're on the way.
    keywords: [arrival window, arrive, arrival, show up, on the way]

transfer:
  number: "(555) 555-0142"   # fictional; no real transfer happens in this build
  handoff_message: >-
    Okay, I'm handing you to someone on the Steadfast team now. Please hold for a moment.
  # Spoken by transfer_call for cancel / refund / billing.
  cant_do_line: >-
    I can't do that myself, but I can connect you with someone who can.

# Spoken by end_call, so the model never has to produce the sign-off.
closing_line: >-
  Thanks for calling Steadfast Heating and Air. Have a good day.

callback_offer: >-
  I don't have that information. I can take a message and have someone from the office call
  you back. Would you like that?

# Only these tools are registered with the LLM. The tool set is read and create only:
# no cancel, delete, refund, or update tools exist. resolve_date only reads the clock; end_call
# writes nothing. lookup_faq is off: with 10 entries the FAQ sits in the system prompt, which saves
# a tool round trip per question. Turn it back on for configs with a larger FAQ.
tools_enabled: [book_appointment, take_message, transfer_call, end_call, resolve_date]

# Pipeline stages, each built by agent/providers.py. `stt` and `tts` are the voice-mode stages
# (agent.voice_server); the text runner and the eval always use typed input and printed output.
# Hosted providers read their key from an environment variable (see agent/providers.py) and are
# never used without a key you supply.
providers:
  stt: whisper       # whisper (local) | deepgram | openai (hosted) | text
  tts: kokoro        # kokoro | piper (local; each needs its extra: uv sync --extra kokoro / --extra piper) | cartesia | elevenlabs | openai (hosted) | text
  llm: auto          # auto = Ollama if it answers with the model pulled, else scripted | ollama | scripted | openai
  ollama:
    model: gpt-oss:20b
    # 127.0.0.1, not localhost: on Windows "localhost" tries IPv6 first and adds ~2 s per request.
    base_url: http://127.0.0.1:11434/v1
    extra: {}        # request extras, e.g. {reasoning_effort: low} for gpt-oss
  whisper: {model: base.en, device: cuda, compute_type: float16}   # falls back to cpu/int8 without a CUDA GPU
  # Smart Turn v3.2 fallback: the longest silence before a turn ends when the model thinks the caller
  # isn't finished. Pipecat's default is 3.0 s; 1.5 s is what the latency probes in the README used.
  smart_turn: {stop_secs: 1.5}
  kokoro: {voice: af_heart}
  piper: {voice: en_US-lessac-medium}
  deepgram: {model: nova-3-general}
  openai:
    # Hosted LLM default: gpt-6-luna at low reasoning effort. Local development stays on Ollama
    # gpt-oss:20b; gpt-4.1-mini is for comparison only, by --model, and is sent without the two
    # settings below.
    llm_model: gpt-6-luna
    llm_reasoning_effort: low
    # Prompt caching on the Responses API. On by default for GPT-5.6 and later; set here so it
    # is explicit. prompt_cache_options: mode implicit, ttl 30m (the only supported value);
    # prompt_cache_key: optional there, gives separate cache accounting.
    # https://developers.openai.com/api/docs/guides/prompt-caching (read 2026-09-26)
    llm_extra:
      prompt_cache_key: steadfast-hvac-receptionist
      prompt_cache_options: {mode: implicit, ttl: 30m}
    stt_model: ""       # empty = Pipecat 1.11.0 defaults
    tts_model: ""
    tts_voice: ""
  cartesia: {voice: "", model: ""}      # voice id comes from your Cartesia account
  elevenlabs: {voice: "", model: ""}    # voice id comes from your ElevenLabs account
