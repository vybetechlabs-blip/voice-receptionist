name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is the platform the suite was developed and verified on.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (no speech engines, no models)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Tests (scripted LLM, no key, no network, no model downloads)
        run: uv run pytest

      - name: Smoke the text mode
        run: echo "/quit" | uv run python -m agent.text_runner --llm scripted
